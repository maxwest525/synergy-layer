name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/aoos-recovery-title-h1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      # tsconfig is strict (noUncheckedIndexedAccess, exactOptionalPropertyTypes,
      # noPropertyAccessFromIndexSignature) but nothing was ever running it:
      # `vite build` does not typecheck, so type errors could reach main freely.
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Test
        if: always()
        run: npm test
      - name: Build
        if: always()
        run: npm run build

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/aoos-recovery-title-h1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Lovable currently updates package.json without regenerating package-lock.json.
      # Install from package.json during recovery without mutating the checkout.
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
